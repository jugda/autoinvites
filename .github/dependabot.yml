version: 2

updates:
  # The workflows pin actions to major tags, so these PRs are how we notice a new major.
  # Two majors had already gone by unnoticed when this repo moved off AWS.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore
    open-pull-requests-limit: 99
    assignees:
      - dasniko

# There is deliberately no entry for the Java dependencies: Dependabot has no ecosystem for
# JBang's //DEPS directives, and the Maven ecosystem needs a pom.xml this project does not
# have. Two options if that gap matters:
#   - Renovate, which does understand JBang scripts, or
#   - `jbang deps@jbangdev src/Autoinvites.java` to check by hand.
