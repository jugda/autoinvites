name: CI

# invites.yml only runs on a schedule, so without this a pull request - a Dependabot
# bump in particular - would carry no checks at all. Its `npm test` step does gate the
# send, but a breaking dependency would then surface as invitations quietly not going
# out, rather than as a red X before the merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test
