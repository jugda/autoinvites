name: Send invites

on:
  schedule:
    # Monday to Saturday, mid-morning. Deliberately not on the hour: GitHub warns that runs
    # "can be delayed during periods of high load" and that "some queued jobs may be
    # dropped" — the start of every hour is the worst offender.
    - cron: '23 10 * * 1-6'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be sent without sending or recording it'
        type: boolean
        default: true

# Never let two runs race on the state commit.
concurrency:
  group: send-invites
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  invites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so the keepalive check and the rebase before push are reliable
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: jbangdev/setup-jbang@v0.1.1
        with:
          # the JDK is already set up above; //JAVA 25 is satisfied by it
          setup-java: 'false'

      - name: Cache JBang and Maven artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.jbang
            ~/.m2/repository
          # //DEPS lines are the dependency manifest, so they are the cache key
          key: jbang-${{ runner.os }}-${{ hashFiles('src/Autoinvites.java', 'test/Tests.java') }}
          restore-keys: jbang-${{ runner.os }}-

      - run: jbang test/Tests.java

      - name: Send invites
        env:
          DRY_RUN: ${{ inputs.dry_run }}

          # Non-sensitive, kept as repository *variables* so they are readable and editable.
          EVENTS_URL: ${{ vars.EVENTS_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}       # optional, default 587
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}   # optional, default: true only on 465
          MASTO_URL: ${{ vars.MASTO_URL }}

          # Repository *secrets*, so they are masked. Note that Actions logs on a public
          # repo are world-readable, which is reason enough to keep the addresses here.
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
        # Run from the checkout root: state/sent.json is resolved against the working
        # directory. The templates are not - they travel inside the jar via //FILES.
        run: jbang src/Autoinvites.java

      - name: Persist state
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/sent.json
          if git diff --cached --quiet; then
            # Nothing was sent. Scheduled workflows in public repos are disabled after
            # 60 days without repository activity, so poke the repo before we get there.
            quiet_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            if [ "$quiet_days" -lt 25 ]; then
              echo "nothing sent; last activity ${quiet_days}d ago, no keepalive needed"
              exit 0
            fi
            git commit --allow-empty -m 'chore: keepalive so the schedule stays enabled'
          else
            git commit -m 'chore: record sent invitations'
          fi
          git pull --rebase --autostash
          git push
