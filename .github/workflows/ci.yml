name: CI

# invites.yml only runs on a schedule, so without this a pull request - a Dependabot
# bump in particular - would carry no checks at all. Its test step does gate the send,
# but a breaking change would then surface as invitations quietly not going out, rather
# than as a red X before the merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: jbangdev/setup-jbang@v0.1.1
        with:
          setup-java: 'false'

      - name: Cache JBang and Maven artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.jbang
            ~/.m2/repository
          key: jbang-${{ runner.os }}-${{ hashFiles('src/Autoinvites.java', 'test/Tests.java') }}
          restore-keys: jbang-${{ runner.os }}-

      - run: jbang test/Tests.java
